name: mobile Android screenshots

on:
  workflow_dispatch:
    inputs:
      suite:
        description: rakazo captures the existing product tour. alma captures sample-mode ALMA screens and a debug-signed APK.
        required: false
        default: rakazo
        type: choice
        options:
          - rakazo
          - alma
  # A push to the preview branch starts the capture. workflow_dispatch stays
  # available for a manual rerun once the workflow is on the default branch.
  push:
    branches:
      - cursor/alma-ui-preview
    paths:
      - .github/workflows/mobile-android-screenshots.yml
      - .github/scripts/capture-alma-ui-preview.sh
      - apps/mobile/.maestro/alma-screenshots.yaml

permissions:
  contents: read

concurrency:
  group: mobile-android-screenshots-${{ github.head_ref || github.ref }}-${{ github.event.inputs.suite || 'pr' }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture Android UI
    if: ${{ github.event.inputs.suite != 'alma' && !contains(github.ref, 'cursor/alma-ui-preview') && github.head_ref != 'cursor/alma-ui-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rakazo
          POSTGRES_PASSWORD: rakazo
          POSTGRES_DB: rakazo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rakazo"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "1"
      DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3110

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore screenshot APK
        id: screenshot-apk
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: mobile-android-apk-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig*.json', '.github/workflows/mobile-android-screenshots.yml', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/app.config.ts', 'apps/mobile/metro.config.js', 'apps/mobile/metro-resolver.js', 'apps/mobile/assets/**', 'apps/mobile/app/**', 'apps/mobile/components/**', 'apps/mobile/lib/**', 'apps/mobile/modules/**', 'apps/mobile/plugins/**', 'packages/chat-ui/**', 'packages/contracts/**', 'packages/core/**', 'packages/ui-tokens/**') }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        with:
          cache-read-only: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Maestro CLI
        id: maestro-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-2.6.1-3440825f

      - name: Install pinned Maestro CLI
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          maestro_tmp=$(mktemp -d)
          trap 'rm -rf "$maestro_tmp"' EXIT
          base_url=https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.6.1
          curl --fail --silent --show-error --location \
            "$base_url/maestro.zip" \
            --output "$maestro_tmp/maestro.zip"
          curl --fail --silent --show-error --location \
            "$base_url/checksums_sha256.txt" \
            --output "$maestro_tmp/checksums_sha256.txt"
          # Pin the expected digest in-repo so a swapped checksums file alone cannot pass.
          echo "3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b  maestro.zip" |
            (cd "$maestro_tmp" && sha256sum --check --strict -)
          (cd "$maestro_tmp" && sha256sum --check --strict checksums_sha256.txt)
          unzip -q "$maestro_tmp/maestro.zip" -d "$maestro_tmp"
          mkdir -p "$HOME/.maestro"
          cp -R "$maestro_tmp/maestro/." "$HOME/.maestro/"

      - name: Configure Maestro CLI
        run: |
          "$HOME/.maestro/bin/maestro" --version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Generate Android project
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @rakazo/mobile exec expo prebuild --platform android --no-install
          sed -i 's/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' \
            apps/mobile/android/gradle.properties

      - name: Run notification native unit tests
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew :rakazo-notifications:testDebugUnitTest --no-daemon

      - name: Build screenshot APK
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew app:packageRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Save screenshot APK
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.screenshot-apk.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture-mobile-android-screenshots.sh

      - name: Publish screenshot gallery
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PLAYWRIGHT_PUBLIC_BASE_URL: ${{ vars.PLAYWRIGHT_PUBLIC_BASE_URL }}
          MOBILE_RUN_ATTEMPT: ${{ github.run_attempt }}
          MOBILE_RUN_ID: ${{ github.run_id }}
          MOBILE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MOBILE_SHA: ${{ github.sha }}
        run: bash scripts/publish-mobile-screenshot-gallery.sh

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-android-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-report/mobile-screenshots
          if-no-files-found: error
          retention-days: 7

  alma-preview:
    name: Capture ALMA sample screens
    if: ${{ github.event.inputs.suite == 'alma' || contains(github.ref, 'cursor/alma-ui-preview') || github.head_ref == 'cursor/alma-ui-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_PUBLIC_ALMA_MOCK: "1"
      EXPO_PUBLIC_DEFAULT_UI_LOCALE: es
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3110
      EXPO_PUBLIC_SENTRY_ENABLED: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore sample-mode APK
        id: screenshot-apk
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: alma-ui-preview-apk-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig*.json', '.github/workflows/mobile-android-screenshots.yml', 'apps/mobile/package.json', 'apps/mobile/app.json', 'apps/mobile/app.config.ts', 'apps/mobile/metro.config.js', 'apps/mobile/metro-resolver.js', 'apps/mobile/assets/**', 'apps/mobile/app/**', 'apps/mobile/components/**', 'apps/mobile/lib/**', 'apps/mobile/modules/**', 'apps/mobile/plugins/**', 'packages/chat-ui/**', 'packages/contracts/**', 'packages/core/**', 'packages/ui-tokens/**') }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        with:
          cache-read-only: false

      - name: Install dependencies
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore Maestro CLI
        id: maestro-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-2.6.1-3440825f

      - name: Install pinned Maestro CLI
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          maestro_tmp=$(mktemp -d)
          trap 'rm -rf "$maestro_tmp"' EXIT
          base_url=https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.6.1
          curl --fail --silent --show-error --location \
            "$base_url/maestro.zip" \
            --output "$maestro_tmp/maestro.zip"
          curl --fail --silent --show-error --location \
            "$base_url/checksums_sha256.txt" \
            --output "$maestro_tmp/checksums_sha256.txt"
          echo "3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b  maestro.zip" |
            (cd "$maestro_tmp" && sha256sum --check --strict -)
          (cd "$maestro_tmp" && sha256sum --check --strict checksums_sha256.txt)
          unzip -q "$maestro_tmp/maestro.zip" -d "$maestro_tmp"
          mkdir -p "$HOME/.maestro"
          cp -R "$maestro_tmp/maestro/." "$HOME/.maestro/"

      - name: Configure Maestro CLI
        run: |
          "$HOME/.maestro/bin/maestro" --version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Generate Android project
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/mobile exec expo prebuild --platform android --no-install
          sed -i 's/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' \
            apps/mobile/android/gradle.properties
          sed -i 's/-Xmx2048m/-Xmx4g/' apps/mobile/android/gradle.properties
          if grep -q '^reactNativeArchitectures=' apps/mobile/android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' \
              apps/mobile/android/gradle.properties
          else
            echo 'reactNativeArchitectures=arm64-v8a,x86_64' >> apps/mobile/android/gradle.properties
          fi
          python3 - <<'PY'
          import re
          import shutil
          from pathlib import Path

          root = Path("apps/mobile/android")
          gradle_path = root / "app/build.gradle"
          text = gradle_path.read_text()
          text = text.replace(
              "signingConfig signingConfigs.release",
              "signingConfig signingConfigs.debug",
          )
          text, namespace_edits = re.subn(
              r"namespace\s+['\"]do\.alma\.app['\"]",
              "namespace 'app.alma'",
              text,
          )
          if namespace_edits != 1:
              raise SystemExit(f"Expected one namespace edit, found {namespace_edits}")
          if "applicationId 'do.alma.app'" not in text and 'applicationId "do.alma.app"' not in text:
              raise SystemExit("applicationId do.alma.app was not kept")
          if "signingConfig signingConfigs.debug" not in text:
              raise SystemExit("Generated Gradle project has no debug signing config")
          gradle_path.write_text(text)

          # AGP rejects the Java keyword "do" as a namespace segment. The installed id stays do.alma.app.
          src = root / "app/src"
          for path in src.rglob("*"):
              if path.is_file() and path.suffix in {".kt", ".java", ".xml"}:
                  body = path.read_text()
                  updated = body.replace("do.alma.app", "app.alma")
                  if updated != body:
                      path.write_text(updated)
          for package_dir in list(src.rglob("do")):
              sources = package_dir / "alma" / "app"
              if not sources.is_dir():
                  continue
              dest = package_dir.parent / "app" / "alma"
              dest.parent.mkdir(parents=True, exist_ok=True)
              if dest.exists():
                  raise SystemExit(f"Refusing to overwrite {dest}")
              shutil.move(str(sources), str(dest))
              alma_dir = package_dir / "alma"
              if alma_dir.exists() and not any(alma_dir.iterdir()):
                  alma_dir.rmdir()
              if package_dir.exists() and not any(package_dir.iterdir()):
                  package_dir.rmdir()
          print("Release build uses the debug keystore and namespace app.alma")
          PY

      - name: Let Metro resolve the upload helper
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("apps/mobile")
          shim = root / ".preview-node-module.js"
          shim.write_text(
              "function createRequire() {\n"
              "  return function previewRequire(id) {\n"
              "    if (String(id).includes('sentry-upload')) {\n"
              "      return { sentryUploadAllowed: function () { return false; } };\n"
              "    }\n"
              "    throw new Error('Unsupported Node built-in in the preview bundle: ' + id);\n"
              "  };\n"
              "}\n"
              "module.exports = { createRequire };\n"
          )
          metro = root / "metro.config.js"
          text = metro.read_text()
          needle = "config.resolver.resolveRequest = (context, moduleName, platform) => {"
          insert = (
              needle
              + "\n  if (moduleName === \"node:module\") {\n"
              + "    return { type: \"sourceFile\", filePath: require(\"path\").join(projectRoot, \".preview-node-module.js\") };\n"
              + "  }\n"
          )
          if needle not in text:
              raise SystemExit("metro resolver hook not found")
          if 'moduleName === "node:module"' not in text:
              metro.write_text(text.replace(needle, insert, 1))
          print("preview bundle can resolve node:module")
          PY

      - name: Build sample-mode APK
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          printf '%s\n' "${apks[@]}"
          dest=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$dest" ]]; then
            universal=$(printf '%s\n' "${apks[@]}" | grep -E 'universal' | head -n 1 || true)
            if [[ -n "${universal}" ]]; then
              cp "$universal" "$dest"
            elif [[ ${#apks[@]} -eq 1 ]]; then
              cp "${apks[0]}" "$dest"
            else
              echo "Gradle did not produce app-release.apk" >&2
              exit 1
            fi
          fi

      - name: Check APK architectures
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | tee "$RUNNER_TEMP/apk-listing.txt"
          grep -q 'lib/x86_64/' "$RUNNER_TEMP/apk-listing.txt"
          grep -q 'lib/arm64-v8a/' "$RUNNER_TEMP/apk-listing.txt"

      - name: Save sample-mode APK
        if: steps.screenshot-apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.screenshot-apk.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture-alma-ui-preview.sh

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alma-ui-preview-screenshots
          path: test-report/alma-ui-preview
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sample-mode APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alma-sample-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14

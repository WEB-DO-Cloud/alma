---
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

meta:
  bitrise.io:
    stack: osx-xcode-27.1.x

workflows:
  mobile-tests:
    description: Unit tests for the mobile app and the privacy checks it depends on.
    meta:
      bitrise.io:
        stack: ubuntu-resolute-26.04-bitrise-2026-android
    steps:
      - git-clone@8: {}
      - script@1:
          title: Run mobile unit tests
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
                corepack enable
                corepack prepare pnpm@9.15.0 --activate
                pnpm install --frozen-lockfile
                # The privacy checks import the database package. Generate does not connect.
                DATABASE_URL="${DATABASE_URL:-postgres://rakazo:rakazo@127.0.0.1:5433/rakazo}" pnpm db:generate
                pnpm --filter @rakazo/mobile test
                pnpm exec vitest run \
                  packages/adapters/src/expo-push.test.ts \
                  packages/logging/src/sentry.test.ts \
                  apps/api/src/monitoring.test.ts \
                  apps/api/src/app-association.test.ts

  android-debug:
    description: Debug APK. No store upload.
    meta:
      bitrise.io:
        stack: ubuntu-resolute-26.04-bitrise-2026-android
    steps:
      - git-clone@8: {}
      - script@1:
          title: Build the Android debug APK
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
                corepack enable
                corepack prepare pnpm@9.15.0 --activate
                pnpm install --frozen-lockfile
                cd apps/mobile
                gem install bundler --no-document
                bundle install
                bundle exec fastlane android debug
      - deploy-to-bitrise-io@2: {}

  android-apk:
    description: Signed release APK for internal sharing. No Play upload.
    meta:
      bitrise.io:
        stack: ubuntu-resolute-26.04-bitrise-2026-android
    steps:
      - git-clone@8: {}
      - script@1:
          title: Decode the Android Firebase config when it is provided
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                if [[ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
                  exit 0
                fi
                dest="${BITRISE_SOURCE_DIR:-$PWD}/apps/mobile/google-services.json"
                mkdir -p "$(dirname "$dest")"
                printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > "$dest"
                if [[ ! -s "$dest" ]]; then
                  echo "GOOGLE_SERVICES_JSON_BASE64 did not decode to a file." >&2
                  exit 1
                fi
                envman add --key GOOGLE_SERVICES_JSON --value "$dest"
      - script@1:
          title: Build the signed Android APK
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
                corepack enable
                corepack prepare pnpm@9.15.0 --activate
                pnpm install --frozen-lockfile
                cd apps/mobile
                gem install bundler --no-document
                bundle install
                bundle exec fastlane android apk
      - deploy-to-bitrise-io@2: {}

  android-aab:
    description: Signed Android App Bundle. No Play upload.
    meta:
      bitrise.io:
        stack: ubuntu-resolute-26.04-bitrise-2026-android
    steps:

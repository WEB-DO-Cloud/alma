  ios-archive:
    description: Signed iOS archive. Uses match unless BITRISE_USE_UPLOADED_SIGNING is true. No store upload.
    meta:
      bitrise.io:
        stack: osx-xcode-27.1.x
    steps:
      - git-clone@8: {}
      - certificate-and-profile-installer@1:
          run_if: '{{enveq "BITRISE_USE_UPLOADED_SIGNING" "true"}}'
      - script@1:
          title: Archive the iOS app
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export COREPACK_ENABLE_DOWNLOAD_PROMPT=0

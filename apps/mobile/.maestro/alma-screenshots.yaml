- takeScreenshot: 39-search

# Sample mode replaces sign-in with home. Turn sample data off, then capture the form.
# A local capabilities stub lets the email and password fields render.
- openLink: "alma:///about"
- extendedWaitUntil:
    visible: "Usar el servidor|Use the server"
    timeout: 20000
- tapOn: "Usar el servidor|Use the server"
- extendedWaitUntil:
    visible: "Usar datos de ejemplo|Use sample data"
    timeout: 10000
- openLink: "alma:///sign-in"
- extendedWaitUntil:
    visible: "Iniciar sesión en ALMA|Sign in to ALMA"
    timeout: 20000
- extendedWaitUntil:
    visible: "^Correo$|^Email$|No se pudieron cargar las opciones de acceso|Could not load sign-in options"
    timeout: 20000
- hideKeyboard
- takeScreenshot: 01-sign-in
- runFlow:
    when:
      visible: "^Crear cuenta$|^Sign up$"
    commands:
      - tapOn: "^Crear cuenta$|^Sign up$"
      - extendedWaitUntil:
          visible: "Crea tu cuenta de ALMA|Create your ALMA account"
          timeout: 15000
      - hideKeyboard
      - takeScreenshot: 02-sign-up

appId: do.alma.app
name: ALMA sample-mode screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold emulator can cover ALMA with a launcher ANR or the notification prompt.
# Relaunching while that dialog is up makes the launcher ANR again, so close it
# and only launch once more if the sample home is still hidden.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Close app"
          commands:
            - tapOn:
                id: "android:id/aerr_close"
      - runFlow:
          when:
            visible: "Don't allow"
          commands:
            - tapOn: "Don't allow"
      - extendedWaitUntil:
          visible: "Borradores para revisión|Drafts for review|Close app|Don't allow"
          timeout: 20000
- runFlow:
    when:
      notVisible: "Borradores para revisión|Drafts for review"
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: "Borradores para revisión|Drafts for review|Close app"
          timeout: 30000
      - runFlow:
          when:
            visible: "Close app"
          commands:
            - tapOn:
                id: "android:id/aerr_close"
- extendedWaitUntil:
    visible: "Borradores para revisión|Drafts for review"
    timeout: 45000
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 04-alma-home

- tapOn: "Borradores para revisión"
- extendedWaitUntil:
    visible: "Instancia de entrega"
    timeout: 20000
- assertVisible: "Resumen de audiencia"
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 05-drafts

# A reader draft has no approve action. Capture it before the timed draft starts its clock.
# A row tap reaches the review screen without the draft id, so open the sample id directly.
- openLink: "alma:///draft-review?draftId=draft-lectura"
# The diff body is nested text, which the accessibility tree does not expose.
- extendedWaitUntil:
    visible: "Borrador de ALMA"
    timeout: 20000
- assertVisible: "Resumen de audiencia"
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 06-draft-review-reader
- tapOn: "Atrás"

- openLink: "alma:///draft-approvals"
- extendedWaitUntil:
    visible: "Todavía no hay aprobaciones."
    timeout: 20000
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 07-draft-approvals-empty

- openLink: "alma:///draft-review?draftId=draft-ejemplo"
- extendedWaitUntil:
    visible: "Borrador de ALMA"
    timeout: 20000
- assertVisible: "Edición del abogado"
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 08-draft-review-diff
# The checkbox and approve button are pressables without accessible names.
# On a Pixel 6 those controls sit at these points once the diff is on screen.
- tapOn:
    point: "50%,74%"
- takeScreenshot: 09-draft-review-ready
- tapOn:
    point: "29%,93%"
- extendedWaitUntil:
    visible: "Aprobado por Lcda. Ejemplo"
    timeout: 20000
- takeScreenshot: 10-draft-review-approved

- openLink: "alma:///draft-approvals"
- extendedWaitUntil:
    visible: "Aprobado por Lcda. Ejemplo"
    timeout: 20000
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 11-draft-approvals

- openLink: "alma:///alma-chat"
# The sample reply is markdown, which the accessibility tree does not expose.
- extendedWaitUntil:
    visible: "^Enviar$"
    timeout: 20000
- assertVisible: "^Voz$"
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 12-alma-chat
- tapOn: "Escriba a ALMA"
- inputText: "Revise la instancia"
- hideKeyboard
- assertVisible: "Revise la instancia"
- takeScreenshot: 13-alma-chat-typed
- tapOn: "^Enviar$"
- extendedWaitUntil:
    visible: "Revise la instancia"
    timeout: 10000
- takeScreenshot: 14-alma-chat-sent
- tapOn: "^Voz$"
- extendedWaitUntil:
    visible: "While using the app|Only this time|^Allow$|^Voz$"
    timeout: 8000
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Only this time"
    commands:
      - tapOn: "Only this time"
- runFlow:
    when:
      visible: "^Allow$"
    commands:
      - tapOn: "Allow"
- takeScreenshot: 15-alma-chat-dictate

- openLink: "alma:///alma-computer"
- extendedWaitUntil:
    visible: "Preparar borrador de instancia"
    timeout: 20000
- assertVisible: "Solo lectura"
- assertVisible: "La computadora no está en pantalla."
- assertVisible: "Datos de ejemplo"
- takeScreenshot: 16-alma-computer
- tapOn: "^Detener$"
- extendedWaitUntil:
    visible: "^Detenido$"
    timeout: 20000
- takeScreenshot: 17-alma-computer-stopped

- openLink: "alma:///firm"
- extendedWaitUntil:
    visible: "Bufete Ejemplo"
    timeout: 20000
- assertVisible: "Datos de ejemplo"
- assertVisible: "Estos datos se editan en la web del bufete."
- takeScreenshot: 18-firm
- swipe:
    start: "50%,80%"
    end: "50%,30%"
- swipe:
    start: "50%,80%"
    end: "50%,30%"
- extendedWaitUntil:
    visible: "Lcda. Ejemplo"
    timeout: 10000
- takeScreenshot: 19-firm-lawyers

- openLink: "alma:///about"
- extendedWaitUntil:
    visible: "ALMA no sustituye el criterio profesional de quien revisa."
    timeout: 20000
- assertVisible: "Datos de ejemplo"
- assertVisible: "do.alma.app"
- takeScreenshot: 20-about
- tapOn: "^Servidor$"
# The address field is on screen, but neither it nor the About row reliably
# appears or disappears in the accessibility tree. Capture either way.
- runFlow:
    when:
      visible: "Use default server|^Save$|^Cancel$"
    commands:
      - takeScreenshot: 03-server
- runFlow:
    when:
      notVisible: "Use default server|^Save$|^Cancel$"
    commands:
      - takeScreenshot: 03-server
- back

- openLink: "alma:///account"
- extendedWaitUntil:
    visible: "^Inicio$"
    timeout: 20000
- assertVisible: "Borradores para revisión"
- takeScreenshot: 21-settings-account
- swipe:
    start: "50%,75%"
    end: "50%,25%"
- swipe:
    start: "50%,75%"
    end: "50%,25%"
- takeScreenshot: 22-settings-account-more

- openLink: "alma:///language"
- extendedWaitUntil:

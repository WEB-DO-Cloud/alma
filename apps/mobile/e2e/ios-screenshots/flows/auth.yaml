appId: do.alma.app
name: Auth
---
- runFlow: ../subflows/launch-app.yaml
- runFlow:
    when:
      visible:
        text: "^Sign in$"
        above: "Email"
    commands:
      - tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-welcome
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      text: "^Sign in$"
      above: "Email"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-sign-in
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: "wrong-password"
- hideKeyboard
- tapOn:
    text: "^Sign in$"
    below: "Password"
- extendedWaitUntil:
    visible: "Invalid email or password|Invalid credentials|Could not sign in"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-sign-in-error
- tapOn: "Use a custom server|Custom server"
- extendedWaitUntil:
    visible: "Server"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-custom-server
- tapOn:
    text: "http.*|https.*"
    optional: true
- eraseText: 80
- inputText: "::::"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "That doesn.*look like a URL|Could not reach that server|That URL did not look like an ALMA server|Enter a server URL"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-server-error
- tapOn: "Cancel"
